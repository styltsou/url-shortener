# Minimal golangci-lint config
# golangci-lint is a SINGLE tool that runs many linters for you
# This is much simpler than installing/running each linter separately

issues:
  exclude-dirs:
    - vendor
    - migrations
  exclude-files:
    - ".*\\.sql\\.go$"  # Generated sqlc files
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - govet         # Basic static analysis
    - staticcheck   # Catches bugs go vet misses
    - unused        # Unused code
    - ineffassign   # Ineffective assignments
    - gosec         # Security checks (Host header injection, credential leaks, etc.)
    - gosimple      # Code simplification suggestions
    - gocritic      # Performance and code smells
    - misspell      # Catches typos in comments/strings
    - goconst       # Finds repeated strings that should be constants
